name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image Docker
        run: docker build -t tp-proactif-1 .
      - name: Scanner l'image avec Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tp-proactif-1
          severity: HIGH,CRITICAL
          exit-code: 1

  # repris du template officiel CodeQL de GitHub, simplifie pour Python
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Initialiser CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
      - name: Lancer l'analyse CodeQL
        uses: github/codeql-action/analyze@v4
